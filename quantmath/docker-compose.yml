version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: quantmath
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  fastapi:
    build:
      context: ./apps/gateway/apps/fastapi
    env_file:
      - ./apps/gateway/apps/fastapi/.env
    ports:
      - "8000:8000"
    depends_on:
      - db

  nestjs:
    build:
      context: ./apps/gateway
    env_file:
      - ./apps/gateway/.env
    ports:
      - "3000:3000"
    depends_on:
      - db
      - fastapi

volumes:
  db_data:
